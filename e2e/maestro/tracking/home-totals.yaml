appId: com.cuantovendi.local
tags:
  - tracking
---
- runFlow: ../_shared/launch-clean.yaml
- runFlow:
    file: ../_shared/create-product.yaml
    env:
      PRODUCT_NAME: 'Lámina Colibrí'
      PRODUCT_PRICE: '15000'
- runFlow:
    file: ../_shared/register-sale.yaml
    env:
      PRODUCT_ROW: 'Lámina Colibrí.*'
- tapOn: 'Listo'
- runFlow: ../_shared/dismiss-notification-intro.yaml
- tapOn: 'Registrar venta'
- tapOn: 'Lámina Colibrí.*'
- tapOn: 'Día anterior'
- assertVisible: 'Ayer.*'
- tapOn: 'Guardar venta'
- tapOn: 'Listo'
- assertVisible: 'Esta semana'
- assertVisible: 'Esta semana vendiste.*(15|30)\.000 pesos.*'
- assertVisible: 'En .*'
- assertVisible: 'Últimas ventas'
- assertVisible: 'Hoy'
- assertVisible: 'Ayer'
- assertNotVisible: '¿Para qué sirve saber cuánto te cuesta?'

appId: com.cuantovendi.local
tags:
  - sales
---
- runFlow: ../_shared/launch-clean.yaml
- runFlow:
    file: ../_shared/create-product.yaml
    env:
      PRODUCT_NAME: 'Lámina Colibrí'
      PRODUCT_PRICE: '15000'
- runFlow:
    file: ../_shared/create-two-version-product.yaml
    env:
      PRODUCT_NAME: 'Print Bosque'
- runFlow:
    file: ../_shared/create-product.yaml
    env:
      PRODUCT_NAME: 'Taza Pájaro'
      PRODUCT_PRICE: '8000'
- tapOn: 'Inicio'
- tapOn: 'Registrar venta'
- tapOn: 'Lámina Colibrí.*'
- scrollUntilVisible:
    element: 'Agregar otro producto'
- tapOn: 'Agregar otro producto'
- tapOn: 'Taza Pájaro.*'
- scrollUntilVisible:
    element: 'Agregar otro producto'
- tapOn: 'Agregar otro producto'
- tapOn: 'Print Bosque.*'
- tapOn: 'Print A3.*'
- scrollUntilVisible:
    element: '22.000'
- tapOn: '22.000'
- eraseText: 10
- inputText: '20000'
- hideKeyboard
- scrollUntilVisible:
    element: 'Más detalles.*'
- tapOn: 'Más detalles.*'
- scrollUntilVisible:
    element: 'Feria'
- tapOn: 'Feria'
- scrollUntilVisible:
    element: 'Por ejemplo, feria del parque.*'
- tapOn: 'Por ejemplo, feria del parque.*'
- inputText: 'Feria del sábado'
- hideKeyboard
- assertVisible: 'Total.*43.000.*'
- tapOn: 'Guardar venta'
- assertVisible: '¡Registraste tu primera venta!'

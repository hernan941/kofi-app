appId: com.cuantovendi.local
tags:
  - foundations
---
- runFlow: ../_shared/launch-clean.yaml
- tapOn: 'Calendario'
- assertVisible: 'Los días en que registres ventas se marcan aquí con puntos.'
- tapOn: 'Productos'
- assertVisible: 'Aquí vas a ver tus productos'
- tapOn: 'Consejos'
- assertVisible: 'Ideas breves para llevar tu negocio.*'
- tapOn: 'Ajustes'
- assertVisible: 'Privacidad'
- tapOn: 'Inicio'
- assertVisible: 'Aquí vas a ver cuánto vendes'
- openLink: cuantovendi://e2e/diagnostics
- assertVisible: 'Diagnóstico de fechas'
- assertVisible: 'Todos los casos coinciden'

appId: com.cuantovendi.local
tags:
  - photos
---
- runFlow: ../_shared/launch-clean.yaml
- runFlow: ../_shared/seed-gallery-images.yaml
- tapOn: 'Productos'
- tapOn: 'Agregar producto'
- runFlow: ../_shared/add-photo-from-gallery.yaml
- assertVisible: '1 de 6'
- tapOn: 'Foto 1 de 1, portada'
- tapOn: 'Quitar foto'
- assertVisible: '¿Quitar esta foto?'
- assertVisible: 'Se quita de este producto. Si la quieres de nuevo, vuelve a elegirla.'
- tapOn: 'Cancelar'
- assertVisible: '1 de 6'
- tapOn: 'Quitar foto'
- tapOn: 'Quitar foto'
- assertVisible: '0 de 6'
- assertNotVisible: 'Portada'
